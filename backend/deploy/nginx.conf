# Reverse proxy for the TechStudyHubCore Pharmacy staff service.
# setup.sh substitutes __DOMAIN__ and installs this to /etc/nginx/sites-available/elibrary.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads pass through here; keep in step with the app's expectations.
    client_max_body_size 25m;

    # Staff sign in over this connection — never cache it.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
